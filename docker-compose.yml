# Local WordPress for this plugin. Core, uploads, and the database live in Docker volumes,
# not in the git tree. The repo is mounted as the plugin folder.
# Start for a check: docker compose up -d
# Stop when the check is done: docker compose down
# `down` keeps the database volume. `down -v` deletes the local site.
# Site:  http://127.0.0.1:8088
# WP-CLI is not started by `up`. Example:
#   docker compose --profile cli run --rm wpcli wp plugin list
name: radius-seo-local

services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: wordpress
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  wordpress:
    image: wordpress:6.8-php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8088:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: "1"
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/wp-radius-seo
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress:/var/www/html
      - ./:/var/www/html/wp-content/plugins/wp-radius-seo
    profiles:
      - cli

volumes:
  db:
  wordpress:
